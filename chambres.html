<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gestion des chambres - Teranga Palace
    </title>


    <!-- =========================
         STYLES
    ========================== -->

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

    <link
        rel="stylesheet"
        href="CSS/admin.css"
    >


    <!-- =========================
         ICÔNES
    ========================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="chambres-page">


    <main class="admin-page">


        <!-- =========================
             EN-TÊTE
        ========================== -->

        <header class="admin-page-header">


            <div class="admin-page-title">

                <span>
                    Administration
                </span>

                <h1>
                    Gestion des chambres
                </h1>

                <p>
                    Ajouter, modifier et suivre l'état
                    des chambres de Teranga Palace.
                </p>

            </div>


            <a
                href="index.html"
                class="btn btn-secondary"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Retour au tableau de bord

            </a>


        </header>


        <!-- =========================
             CONTENU
        ========================== -->

        <div class="admin-layout">


            <!-- =========================
                 FORMULAIRE
            ========================== -->

            <section class="admin-panel">


                <div class="admin-panel-header">

                    <h2>

                        <i class="fa-solid fa-bed"></i>

                        Nouvelle chambre

                    </h2>

                    <p>
                        Renseignez les caractéristiques
                        de la chambre.
                    </p>

                </div>


                <div class="admin-panel-body">


                    <form
                        id="chambre-form"
                        class="admin-form"
                    >


                        <!-- NUMÉRO -->

                        <div class="form-group">

                            <label for="numero_chambre">

                                <i class="fa-solid fa-hashtag"></i>

                                Numéro de chambre

                            </label>


                            <input
                                type="number"
                                id="numero_chambre"
                                placeholder="Ex : 205"
                                min="1"
                                required
                            >

                        </div>


                        <!-- TYPE -->

                        <div class="form-group">

                            <label for="type">

                                <i class="fa-solid fa-door-open"></i>

                                Type de chambre

                            </label>


                            <select
                                id="type"
                                required
                            >

                                <option value="">
                                    -- Choisir le type --
                                </option>

                                <option
                                    value="Simple"
                                    data-prix="30000"
                                >
                                    Simple
                                </option>

                                <option
                                    value="Double"
                                    data-prix="50000"
                                >
                                    Double
                                </option>

                                <option
                                    value="Suite"
                                    data-prix="100000"
                                >
                                    Suite
                                </option>

                            </select>

                        </div>


                        <!-- PRIX -->

                        <div class="form-group">

                            <label for="prix_par_nuit">

                                <i class="fa-solid fa-money-bill-wave"></i>

                                Prix par nuit

                            </label>


                            <input
                                type="number"
                                id="prix_par_nuit"
                                placeholder="Prix calculé automatiquement"
                                readonly
                            >

                        </div>


                        <!-- CAPACITÉ -->

                        <div class="form-group">

                            <label for="capacite">

                                <i class="fa-solid fa-users"></i>

                                Capacité maximale

                            </label>


                            <input
                                type="number"
                                id="capacite"
                                placeholder="Capacité calculée automatiquement"
                                readonly
                                required
                            >

                        </div>


                        <!-- STATUT -->

                        <div class="form-group">

                            <label for="statut">

                                <i class="fa-solid fa-circle-info"></i>

                                Statut de la chambre

                            </label>


                            <select
                                id="statut"
                                required
                            >

                                <option value="">
                                    -- Choisir un statut --
                                </option>

                                <option value="Disponible">
                                    Disponible
                                </option>

                                <option value="Occupée">
                                    Occupée
                                </option>

                                <option value="Hors service">
                                    Hors service
                                </option>

                            </select>

                        </div>


                        <!-- ACTIONS -->

                        <div class="form-actions">


                            <button
                                type="submit"
                                id="chambre-submit-btn"
                                class="btn btn-primary"
                            >

                                <i class="fa-solid fa-plus"></i>

                                Ajouter chambre

                            </button>


                            <button
                                type="button"
                                id="annuler-chambre-btn"
                                class="btn btn-secondary"
                                style="display: none;"
                            >

                                <i class="fa-solid fa-xmark"></i>

                                Annuler

                            </button>


                        </div>


                    </form>


                </div>


            </section>


            <!-- =========================
                 LISTE DES CHAMBRES
            ========================== -->

            <section class="admin-panel">


                <div class="admin-panel-header">

                    <h2>

                        <i class="fa-solid fa-hotel"></i>

                        Chambres enregistrées

                    </h2>

                    <p>
                        Consultez les chambres,
                        leurs tarifs et leur disponibilité.
                    </p>


                    <div class="clients-search">

                        <i class="fa-solid fa-magnifying-glass"></i>


                        <input
                            type="search"
                            id="recherche-chambre"
                            placeholder="Rechercher par numéro, type ou statut..."
                            autocomplete="off"
                        >

                    </div>


                </div>


                <div
                    id="chambres-list"
                    class="admin-list"
                >

                    <!-- Les chambres seront affichées ici -->

                </div>


            </section>


        </div>


    </main>


    <!-- =========================
         SUPABASE / JAVASCRIPT
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="JS/supabase.js"></script>

    <script src="JS/chambres.js"></script>


</body>

</html>
